# PLSC 2219 forecast archive — source registry, 2026 cycle
#
# This file IS the cycle. To run 2028, copy it to 2028.yaml and edit.
# No code should need to change.
#
# ---------------------------------------------------------------------------
# FIELDS
#   id              stable slug; becomes the raw/ directory name. Never rename.
#   name            human label shown on the site
#   category        fundamentals | polling | professional | market | expert_ordinal
#                   These are the DISPLAY categories: the site averages within
#                   each and shows the spread between them. `expert_ordinal` is
#                   collected but deliberately kept OUT of the dispersion figure,
#                   because ordinal ratings do not average with vote shares.
#   method          how capture.py fetches it (see collect/capture.py handlers)
#   cadence         daily | weekly | sporadic   (informational; the runner
#                   respects `enabled`, the Action schedule sets real cadence)
#   publication     individual | aggregate_only | private
#                   What may be shown publicly. Enforced at render, not capture.
#   declared_inputs other source ids this forecaster consumes. Load-bearing:
#                   these sources are NOT independent, and an archive that
#                   treats them as independent understates correlated error.
#   license         permitted | permission_pending | prohibited
#                   *** capture.py SKIPS anything that is not `permitted`. ***
#   robots_checked  date the robots.txt was last verified by a human
#   notes           anything a future reader needs
# ---------------------------------------------------------------------------

cycle: 2026
election_date: 2026-11-03

contact:
  # Sent as the User-Agent on every request. Do not remove — looking like an
  # academic archive rather than an anonymous scraper is most of the legal
  # posture here.
  project: "PLSC 2219 Forecast Archive (Yale University)"
  url: "https://kevinmdeluca.com/forecast/2026/"
  email: "kevin.deluca@yale.edu"

defaults:
  timeout_seconds: 30
  max_retries: 4
  backoff_base_seconds: 2
  min_interval_seconds: 1.0   # polite floor between requests to one host

sources:

  # ---------------------------------------------------------------- markets --

  - id: kalshi
    name: Kalshi
    category: market
    method: kalshi_discover
    enabled: true
    cadence: daily
    publication: individual        # permissive terms; may be shown per-source
    declared_inputs: []
    license: permitted
    robots_checked: 2026-08-19
    config:
      api_base: https://api.elections.kalshi.com/trade-api/v2
      # Discovery: page the series list, fetch markets only for tickers matching
      # `series_include` and not matching `series_exclude`. The full series list
      # is stored every run regardless, so the filter can always be audited
      # after the fact and re-run against history.
      #
      # Tightened 2026-08-19 after the first real run matched 137 series, of
      # which ~128 were noise: Kalshi's Politics category is dominated by
      # legislative-action markets (tariff votes, expulsions, Epstein files) and
      # foreign elections. Anchoring is what does the work here.
      series_include: "^(HOUSE|SENATE|HOUSEMOV|SENATEMOV|KXHOUSE|KXSENATE|KXSENATERUN|KXHOUSEMINORITY|KXGENERICBALLOT.*|KXGOVERNOR.*|KXMIDTERM.*)$"
      series_exclude: "^(PRESPARTY|KXPRES)"
      series_category: Politics
      page_limit: 200
      max_pages: 20
    notes: >
      Prices are fixed-point STRINGS ("0.4200") since the integer-cent fields
      were removed in Q1 2026 — do not coerce to int in the parser.
      No Retry-After header on 429, so backoff must be self-timed.
      robots.txt explicitly allows AI agents.
      THE REAL MIDTERM SERIES (verified 2026-08-19): HOUSE and SENATE are chamber
      control; HOUSEMOV and SENATEMOV are margin of victory; KXHOUSE and KXSENATE
      hold per-seat markets; KXGENERICBALLOTVOTEHUB is the generic ballot.
      DELIBERATELY EXCLUDED: the PRESPARTY* family (57 series) is the 2028
      presidential race by state. Real forecasts, but a different election and a
      different archive. If you ever want them, give them their own source id and
      cycle rather than smuggling them in under 2026.
      Near-misses are logged each run, so a renamed series shows up in the log
      rather than vanishing silently.
      REALITY CHECK, 2026-08-19: HOUSE, SENATE, HOUSEMOV, SENATEMOV and KXHOUSE
      all return {"cursor":"","markets":[]} — the series exist as shells but
      Kalshi has NOT opened 2026 chamber-control markets under them. The only
      populated election series is KXGENERICBALLOTVOTEHUB, and that is a weekly
      ladder of "Above X%" threshold contracts with no prices in the /markets
      response (they would need the orderbook endpoint), so it is not parsed yet.
      CONSEQUENCE: Kalshi currently contributes ZERO rows, and the parser returns
      an empty list rather than raising — that is the honest report, not a bug.
      Capture continues daily because the empty response is itself worth
      archiving: the day they open those markets, the archive shows exactly when.
      The market category therefore rests on Polymarket alone for now, which the
      display flag correctly reports as a single source.

  - id: polymarket
    name: Polymarket
    category: market
    method: polymarket_discover
    enabled: true
    cadence: daily
    publication: individual
    declared_inputs: []
    license: permitted
    robots_checked: 2026-08-19
    config:
      gamma_base: https://gamma-api.polymarket.com
      slugs:
        - balance-of-power-2026-midterms
      # ONE snapshot of the active-event list, not one per search term. The
      # first real run fetched the same unfiltered 4.5 MB response three times
      # because the "search terms" were never actually sent as a query — 13.6 MB
      # a day for one page of data. Fixed 2026-08-19.
      snapshot_active_events: true
      page_limit: 500
    notes: >
      robots.txt has no Disallow at all. Per-seat market coverage was UNVERIFIED
      in the audit; the stored event list is what settles it — grep the capture
      for per-seat questions before writing more of the parser.
      Size note: the active-event list is ~4.5 MB/day and mostly crypto and
      sports. It is kept whole because filtering at capture time would violate
      the store-raw-first rule, but if the private repo gets uncomfortable this
      is the first place to look.

  # ----------------------------------------------------------------- hybrid --

  - id: grant_williams
    name: Grant Williams 2026 Midterms Forecast
    category: professional
    method: http
    enabled: true
    cadence: daily
    publication: individual        # MIT licensed
    declared_inputs: [silver_bulletin]   # takes polling input from Silver Bulletin
    license: permitted
    robots_checked: 2026-08-19
    config:
      urls:
        - name: house_forecast
          url: https://grantbw4.github.io/2026-midterms-forecast/forecast.json
        - name: senate_forecast
          url: https://grantbw4.github.io/2026-midterms-forecast/senate_forecast.json
        # timeline.json 404s as of 2026-08-19 — he publishes only the two
        # forecast files. Left out rather than generating a daily failure note.
    notes: >
      MIT licence, repo grantbw4/2026-midterms-forecast (default branch `master`).
      IMPORTANT: outputs/ is GITIGNORED in the repo — the JSON is built by his
      Action and published to GitHub Pages, which OVERWRITES each run. So his git
      history is NOT an archive of the forecast, contrary to an earlier note here.
      Nothing preserves his daily series except our capture. That makes daily
      collection of this source more valuable, not less.
      Verified 2026-08-19: forecast.json served at the Pages root, 200 OK.
      NOT independent: polling input comes from Silver Bulletin.
      DO NOT extract the per-district `pvi` field — it is sourced from Cook PVI
      (see pvi_source), which is permission_pending. Ingesting it would launder
      a gated source through a permitted one.

  - id: ddhq
    name: Decision Desk HQ
    category: professional
    method: http
    enabled: false                 # <-- blocked pending robots check
    cadence: daily
    publication: aggregate_only
    declared_inputs: [polymarket, kalshi]   # ingests BOTH markets by volume weight
    license: permission_pending
    robots_checked: null
    config:
      urls:
        - name: forecast_2026
          url: https://votes.decisiondeskhq.com/forecast/2026
        - name: forecast_senate
          url: https://votes.decisiondeskhq.com/forecast/2026/senate
    notes: >
      decisiondeskhq.com robots.txt is `Allow: /`, but the forecast lives on the
      votes. SUBDOMAIN whose robots could not be retrieved during the audit.
      ACTION: fetch https://votes.decisiondeskhq.com/robots.txt by hand, and if
      clear, set enabled:true and license:permitted.
      Ingests Polymarket and Kalshi, so it is NOT independent of the market
      category — do not treat as a separate draw.

  # ---------------------------------------------------------------- polling --

  - id: silver_bulletin
    name: Silver Bulletin generic ballot
    category: polling
    method: http
    enabled: true
    cadence: daily
    publication: aggregate_only    # see licence note — collect yes, republish no
    declared_inputs: []
    license: permitted
    robots_checked: 2026-08-19
    config:
      urls:
        - name: generic_ballot_polls
          url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRsvXNCZ0ubJr8D_yNcU5q6C0_HBa35K7oDK03KpO7Ca43UwdXaIdvVLWoXEmHHph0EREz5430Hm5yZ/pub?output=csv"
    notes: >
      THIS IS THE POLLING CATEGORY. Roughly 350 individual generic-ballot polls
      from Aug 2025 onward, 25 columns, updated near-daily. Columns include both
      raw (dem/rep/net) and house-effect + likely-voter adjusted (adjusted_*)
      figures, each poll's weight and influence in his average, and a URL back to
      the original pollster release.
      ROBOTS: natesilver.net blocks GPTBot and Google-Extended but does NOT name
      ClaudeBot, CCBot or anthropic-ai. The CSV is a published-to-web Google
      Sheet, which Google's robots explicitly permits (Allow: /spreadsheets/d/*/pub).
      LICENCE: none stated. He publishes the sheet deliberately for reuse, but
      there is no CC grant, so this is `aggregate_only` — we may compute and show
      a polling average, we may NOT republish his individual poll rows. Worth
      writing to ask; a yes would upgrade this to `individual`.
      ARCHIVE VALUE: the adjusted_* columns are model output that gets revised
      retroactively. Capturing daily preserves the vintage structure, which
      neither Silver nor anyone else keeps. That is a genuinely novel thing this
      archive would hold.
      His pre-2025 historical archive is paywalled; only the current cycle is free.
      SCOPE: this entry covers the FREE generic-ballot poll list only. His 2026
      FLIPR seat forecast is paid-subscriber-only and is NOT collected — if you
      ever get access, it belongs in `professional`, as a separate source id, not
      folded in here. Keeping the two apart matters: grant_williams declares
      silver_bulletin as a polling input, so merging them would make the
      dependency graph lie.

  # --------------------------------------------- baselines (static reference) --

  - id: medsl
    name: MIT Election Data and Science Lab — official returns
    category: fundamentals
    method: http
    enabled: true
    cadence: sporadic              # certified results do not change
    publication: individual        # CC0 — public domain dedication
    declared_inputs: []
    license: permitted
    robots_checked: 2026-08-19
    config:
      urls:
        - name: president_state_2024
          url: https://raw.githubusercontent.com/MEDSL/2024-elections-official/main/2024-president-state.csv
        - name: senate_state_2024
          url: https://raw.githubusercontent.com/MEDSL/2024-elections-official/main/2024-senate-state.csv
        # The full 1976-2024 series, which carries 2020 as well as 2024 — both
        # cycles are needed for a Cook-style two-election state PVI. UNVERIFIED:
        # Dataverse was unreachable from the machine this registry was written
        # on. Per-URL isolation means a 404 here costs nothing; if it fails,
        # check the download path at
        # https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/42MVDX
        - name: president_state_1976_2024
          url: "https://dataverse.harvard.edu/api/access/dataset/:persistentId/?persistentId=doi:10.7910/DVN/42MVDX"
    notes: >
      STATEWIDE PARTISAN BASELINES for the ~35 Senate and ~36 Governor races,
      the statewide equivalent of the district PVI we hold from Cook.
      Licence CC0 1.0 (public domain dedication) via Harvard Dataverse
      doi:10.7910/DVN/42MVDX, "U.S. President 1976-2024", version 10.0. No
      attribution obligation, no share-alike, fully redistributable — the only
      genuinely unencumbered source in this registry.
      WHY NOT COOK'S STATE PVI: it exists, but cookpolitical.com robots gives
      ClaudeBot `Disallow: /`, the page is subscriber-only, and the terms forbid
      use "as a stand-alone product apart from your own work" — which a
      redistributable archive of PVI values plainly is. We compute our own from
      MEDSL instead, using Cook's published method (2020 and 2024 presidential
      two-party vote vs the national average, weighting the recent election more
      heavily). Same construct, zero encumbrance, fully documentable.
      2020 presidential by state is needed for the two-cycle blend and should
      arrive in the 1976-2024 Dataverse bundle above. Confirm on the first run.
      MODELLING CAUTION: Senate and especially Governor races are much less
      nationalised than House races, so a presidential-derived baseline needs a
      WIDER error band for Governor than Senate, and wider for Senate than House.
      Do not apply one uniform swing to all three. (Sievert & McKee 2019; Hopkins.)

  # ----------------------------------------------- manual entry (not scraped) --

  - id: cook_state_pvi
    name: Cook PVI — statewide
    category: fundamentals
    method: manual
    enabled: true
    cadence: sporadic
    publication: private           # *** NEVER published, same as district PVI ***
    declared_inputs: []
    license: permitted             # permitted to COLLECT by hand, NOT to republish
    robots_checked: 2026-08-19
    config:
      source_url: https://www.cookpolitical.com/cook-pvi/2025-partisan-voting-index/state-map-and-list
    notes: >
      Statewide PVI for all 50 states and DC — the baseline the Senate and
      Governor models need, the statewide analogue of the district file.
      NOT SCRAPED. cookpolitical.com gives ClaudeBot `Disallow: /`, the page is
      subscriber-only, and the terms forbid use "as a stand-alone product apart
      from your own work". Hand-entered from a page the instructor subscribes to,
      same as the district file. Import with:
        python3 forecast/collect/manual_import.py --source cook_state_pvi --file <paste>
      SOURCED VIA WIKIPEDIA (decided 2026-08-19). Cook's own state page is
      subscriber-only and hard to even find. Wikipedia's "Cook Partisan Voting
      Index" article carries the same table, sourced to Cook's 2025 release.
      IMPORTANT: taking it from Wikipedia does NOT relicense it. Wikipedia's
      CC BY-SA covers Wikipedia's own text; it cannot relicense Cook's
      compilation, and Cook's terms forbid use "as a stand-alone product apart
      from your own work". So this stays `private` exactly as if taken from
      Cook directly. Class use only.
      Record the retrieval route in the import: --accessed-url should point at
      the Wikipedia article, not at cookpolitical.com, because that is what was
      actually read.
      Cook's stated method: based on the 2020 AND 2024 presidential elections
      versus the national average, with the more recent election weighted more
      heavily (2022 methodology update).
      CROSS-CHECK: we can compute our own state PVI from MEDSL (CC0) using that
      same method. Holding both lets us validate ours against theirs and publish
      OURS, which is the point — a redistributable index we can actually show.

  - id: cook_pvi
    name: Cook Partisan Voting Index (2026 lines)
    category: fundamentals
    method: manual                 # entered by a human; capture.py never fetches it
    enabled: true
    cadence: sporadic              # PVI is recomputed once per redistricting
    publication: private           # *** NEVER published, in any form ***
    declared_inputs: []
    license: permitted             # permitted to COLLECT by hand, NOT to republish
    robots_checked: 2026-08-19
    config:
      source_url: https://www.cookpolitical.com/cook-pvi/2026-partisan-voting-index/district-map-and-list
    notes: >
      NOT SCRAPED, AND MUST NOT BE. cookpolitical.com declares the ratings
      proprietary and enforces against crawlers at the Cloudflare edge; the
      `cook` source elsewhere in this registry stays permission_pending for
      exactly that reason.
      This entry is for data typed or pasted in by hand from a page the
      instructor is entitled to view, which is a different act from automated
      collection. Import with:
        python3 forecast/collect/manual_import.py --source cook_pvi --file <paste.txt>
      The verbatim paste is stored alongside the parsed rows, hashed, with the
      date and the person who entered it, so provenance matches an automated
      capture.
      WHY WE HOLD IT: the class fundamentals model needs a district baseline.
      PVI is a better baseline than a single cycle's presidential result because
      it averages two cycles against the national vote.
      PUBLICATION: private, and `pvi` is additionally in NEVER_PUBLISH in
      aggregate.py. If Cook grants written permission, relax the registry field
      FIRST and NEVER_PUBLISH second — never the other way round.

  # -------------------------------------------------------- poll aggregator --

  - id: rcp
    name: RealClearPolling
    category: polling
    method: http
    enabled: false                 # 403s to any non-browser client — see notes
    cadence: daily
    publication: aggregate_only
    declared_inputs: []
    license: permitted
    robots_checked: 2026-08-19
    config:
      urls:
        - name: senate_map
          url: https://www.realclearpolling.com/maps/senate/2026/toss-up
        - name: latest_polls_2026
          url: https://www.realclearpolling.com/latest-polls/2026
        - name: latest_polls_senate
          url: https://www.realclearpolling.com/latest-polls/senate
        - name: latest_polls_house
          url: https://www.realclearpolling.com/latest-polls/house
    notes: >
      DISABLED 2026-08-19. Returns 403 Forbidden to every request, from a
      datacentre IP (GitHub Actions) AND from a residential one. So it is not IP
      reputation — RCP filters on the request itself.
      The awkward part: their robots.txt PERMITS this. Only
      /latest-polls/main-latest-polls is disallowed, there are no AI-bot rules
      and no Crawl-delay. Their published policy and their actual enforcement
      disagree.
      We treat the enforcement as the real signal and stay out. Getting round a
      bot filter is not something this project can do and still describe its own
      methods honestly on a public methodology page.
      ROUTES BACK IN, in order of preference:
        1. Wikipedia's poll-aggregation table already lists RCP's average
           alongside other aggregators, under CC BY-SA. Second-hand but clean.
        2. Hand-enter the headline number weekly (see manual_import.py). The
           scope doc's own rule: for a source that moves a few times a month,
           two minutes of typing never breaks and sidesteps the question.
        3. Write and ask. An academic archive with per-source attribution is a
           very different request from a scraper, and they may simply say yes.
      Also note RCP publishes its own ordinal ratings map, which would
      double-count into expert_ordinal; pick one at render time.

  # ----------------------------------------------------- ratings aggregator --

  - id: wikipedia
    name: Wikipedia race ratings
    category: expert_ordinal
    method: wikipedia
    enabled: true
    cadence: daily
    publication: individual        # CC BY-SA 4.0, attribution required
    declared_inputs: [cook, sabato, inside_elections, race_to_the_wh, economist, votehub, split_ticket]
    license: permitted
    robots_checked: 2026-08-19
    config:
      api: https://en.wikipedia.org/w/api.php
      pages:
        - "2026 United States House of Representatives election ratings"
        - "2026 United States Senate elections"
        - "2026 United States gubernatorial elections"
        # Added 2026-08-19. Carries a poll-AGGREGATION table: one row per
        # aggregator (RCP, Silver Bulletin, ...) with dates, R, D, and margin.
        # This is how the polling category gets populated now that RCP blocks
        # direct collection — second-hand, but CC BY-SA and openly available.
        - "2026 United States House of Representatives elections"
      # Backfill walks revision history to the start of the cycle. This is the
      # ONLY source in the whole registry that recovers the past — everything
      # else only exists going forward from the day capture starts.
      backfill:
        enabled: true
        since: 2026-01-01
        max_revisions_per_page: 2000
    notes: >
      CC BY-SA 4.0 — reusable with attribution and share-alike. Full MediaWiki
      API, complete revision history. There is NO standalone Senate ratings
      article; Senate ratings live inside the main Senate elections page.
      Tables lag the forecasters by weeks (June dates observed in August), so
      treat the "as of" dates in the table as authoritative, not the revision
      timestamp.
      TWO DIFFERENT TABLE SHAPES now captured: the ratings articles give one
      column per forecaster with ordinal values; the House elections article
      gives one ROW per poll aggregator with numeric R/D/margin. The parser
      currently reads only the first. Bytes for the second are banking from
      today, so the parser can be written whenever — that is the whole point of
      capturing before parsing.

