# PLSC 2219 forecast archive — source registry, 2026 cycle
#
# This file IS the cycle. To run 2028, copy it to 2028.yaml and edit.
# No code should need to change.
#
# ---------------------------------------------------------------------------
# FIELDS
#   id              stable slug; becomes the raw/ directory name. Never rename.
#   name            human label shown on the site
#   category        fundamentals | polling | professional | market | expert_ordinal
#                   These are the DISPLAY categories: the site averages within
#                   each and shows the spread between them. `expert_ordinal` is
#                   collected but deliberately kept OUT of the dispersion figure,
#                   because ordinal ratings do not average with vote shares.
#   method          how capture.py fetches it (see collect/capture.py handlers)
#   cadence         daily | weekly | sporadic   (informational; the runner
#                   respects `enabled`, the Action schedule sets real cadence)
#   publication     individual | aggregate_only | private
#                   What may be shown publicly. Enforced at render, not capture.
#   declared_inputs other source ids this forecaster consumes. Load-bearing:
#                   these sources are NOT independent, and an archive that
#                   treats them as independent understates correlated error.
#   license         permitted | permission_pending | prohibited
#                   *** capture.py SKIPS anything that is not `permitted`. ***
#   robots_checked  date the robots.txt was last verified by a human
#   notes           anything a future reader needs
# ---------------------------------------------------------------------------

cycle: 2026
election_date: 2026-11-03

contact:
  # Sent as the User-Agent on every request. Do not remove — looking like an
  # academic archive rather than an anonymous scraper is most of the legal
  # posture here.
  project: "PLSC 2219 Forecast Archive (Yale University)"
  url: "https://kevinmdeluca.com/forecast/2026/"
  email: "kevin.deluca@yale.edu"

defaults:
  timeout_seconds: 30
  max_retries: 4
  backoff_base_seconds: 2
  min_interval_seconds: 1.0   # polite floor between requests to one host

sources:

  # ---------------------------------------------------------------- markets --

  - id: kalshi
    name: Kalshi
    category: market
    method: kalshi_discover
    enabled: true
    cadence: daily
    publication: individual        # permissive terms; may be shown per-source
    declared_inputs: []
    license: permitted
    robots_checked: 2026-08-19
    config:
      api_base: https://api.elections.kalshi.com/trade-api/v2
      # Discovery: page the series list, fetch markets only for tickers matching
      # `series_include` and not matching `series_exclude`. The full series list
      # is stored every run regardless, so the filter can always be audited
      # after the fact and re-run against history.
      #
      # Tightened 2026-08-19 after the first real run matched 137 series, of
      # which ~128 were noise: Kalshi's Politics category is dominated by
      # legislative-action markets (tariff votes, expulsions, Epstein files) and
      # foreign elections. Anchoring is what does the work here.
      #
      # KX[DR](HOUSE|SENATE)SEATS are the seat-COUNT ladders, and they are the
      # only place any exchange quotes a distribution over seat counts rather
      # than a single control price. They were missing from this list, which is
      # why the Markets column for seats was empty. The R-side variants are
      # captured too though nothing parses them yet — bytes are cheap, and a
      # series we already hold history for is one we can backfill.
      #
      # They are ALSO in series_always below, and that is the entry that does the
      # work: adding them here changed nothing, because Kalshi's series index
      # does not list them at all. See series_always.
      series_include: "^(HOUSE|SENATE|HOUSEMOV|SENATEMOV|KXHOUSE|KXSENATE|KXSENATERUN|KXHOUSEMINORITY|KX[DR]HOUSESEATS|KX[DR]SENATESEATS|KXHOUSEPOPVOTEMARGIN|KXGENERICBALLOT.*|KXGOVERNOR.*|KXMIDTERM.*)$"
      series_exclude: "^(PRESPARTY|KXPRES)"
      series_category: Politics
      page_limit: 200
      max_pages: 20
      # Fetched by name every run, whether or not discovery lists them.
      #
      # WHY THIS EXISTS. Kalshi's /series index is incomplete. Verified
      # 2026-08-21: ?category=Politics returns 2,211 series and ?category=
      # Elections returns 79, neither carries a cursor to page past, and
      # KXDHOUSESEATS is in neither — while /series/KXDHOUSESEATS answers for it
      # (category "Elections") and /markets?series_ticker=KXDHOUSESEATS returns
      # the full open ladder, priced, six buckets deep. Adding the ticker to
      # series_include on 08-19 therefore had no effect: you cannot filter a list
      # into containing something.
      #
      # The cost of a hardcoded ticker is a rename we would not notice, so
      # capture.py NOTES loudly when one of these comes back with no markets.
      # Keep the list to things checked by hand.
      series_always:
        - KXDHOUSESEATS
        - KXDSENATESEATS
        - KXRHOUSESEATS
        - KXRSENATESEATS
        # The national House popular-vote margin ladder, and the ONLY
        # market-implied national vote share that exists anywhere — the Markets
        # column on the margin comparison was empty because chamber-control
        # prices do not imply one. Verified 2026-08-21 that the series index
        # does not list it either: it returns 30 tickers matching POPVOTE or
        # MARGIN and every one of them is a 2024 leftover.
        - KXHOUSEPOPVOTEMARGIN
    notes: >
      Prices are fixed-point STRINGS ("0.4200") since the integer-cent fields
      were removed in Q1 2026 — do not coerce to int in the parser.
      No Retry-After header on 429, so backoff must be self-timed.
      robots.txt explicitly allows AI agents.
      THE REAL MIDTERM SERIES (verified 2026-08-19): HOUSE and SENATE are chamber
      control; HOUSEMOV and SENATEMOV are margin of victory; KXHOUSE and KXSENATE
      hold per-seat markets; KXGENERICBALLOTVOTEHUB is the generic ballot.
      DELIBERATELY EXCLUDED: the PRESPARTY* family (57 series) is the 2028
      presidential race by state. Real forecasts, but a different election and a
      different archive. If you ever want them, give them their own source id and
      cycle rather than smuggling them in under 2026.
      Near-misses are logged each run, so a renamed series shows up in the log
      rather than vanishing silently.
      REALITY CHECK, 2026-08-19: HOUSE, SENATE, HOUSEMOV, SENATEMOV and KXHOUSE
      all return {"cursor":"","markets":[]} — the series exist as shells but
      Kalshi has NOT opened 2026 chamber-control markets under them. The only
      populated election series is KXGENERICBALLOTVOTEHUB, and that is a weekly
      ladder of "Above X%" threshold contracts with no prices in the /markets
      response (they would need the orderbook endpoint), so it is not parsed yet.
      This note used to end "CONSEQUENCE: Kalshi contributes ZERO rows" and
      that has been WRONG since 2026-08-21. The chamber-control shells are still
      empty, but the SEAT and MARGIN ladders are not, and they were never in the
      series index — see series_always. Kalshi now supplies the only
      market-implied seat distribution and the only market-implied national
      margin on the site: House 229.8 seats and D+7.72, Senate 49.9, as of
      2026-08-22. Capture of the empty shells continues, because the day they
      open, the archive shows exactly when.

  - id: polymarket
    name: Polymarket
    category: market
    method: polymarket_discover
    enabled: true
    cadence: daily
    publication: individual
    declared_inputs: []
    license: permitted
    robots_checked: 2026-08-19
    config:
      gamma_base: https://gamma-api.polymarket.com
      slugs:
        - balance-of-power-2026-midterms
        # The national House popular-vote margin ladder — thirteen Yes/No
        # markets covering the line in 2-point steps. Better resolved than
        # Kalshi's equivalent, which collapses every Republican outcome into a
        # single bucket: this one runs R 0-2, 2-4, 4-6 and 6%+, so neither tail
        # has to be assumed. Both are collected because they answer the same
        # question at different resolution and the gap is worth watching; on
        # 2026-08-21 they read D+7.58 and D+7.83.
        #
        # The event also carries an "any other outcome" market priced at 0.455,
        # which is not a bucket and would wreck the expectation. The parser
        # matches on party-and-threshold in the question text, so it is skipped
        # rather than filtered by name.
        - 2026-midterms-house-popular-vote-margin-of-victory-224
      # ONE snapshot of the active-event list, not one per search term. The
      # first real run fetched the same unfiltered 4.5 MB response three times
      # because the "search terms" were never actually sent as a query — 13.6 MB
      # a day for one page of data. Fixed 2026-08-19.
      snapshot_active_events: true
      page_limit: 500
    notes: >
      robots.txt has no Disallow at all. Per-seat market coverage was UNVERIFIED
      in the audit; the stored event list is what settles it — grep the capture
      for per-seat questions before writing more of the parser.
      Size note: the active-event list is ~4.5 MB/day and mostly crypto and
      sports. It is kept whole because filtering at capture time would violate
      the store-raw-first rule, but if the private repo gets uncomfortable this
      is the first place to look.

  # ----------------------------------------------------------------- hybrid --

  - id: grant_williams
    name: Grant Williams 2026 Midterms Forecast
    category: professional
    method: http
    enabled: true                  # STILL COLLECTED DAILY. See publication.
    cadence: daily
    publication: private
    # WAS `individual` (MIT licensed, so we may republish him race by race).
    # Changed 2026-08-22, and NOT for a licence reason: his seat numbers carry
    # a units error we can demonstrate, and this archive should not publish a
    # number it can show to be wrong.
    #
    # THE DIAGNOSTIC, so a future reader can re-check it rather than trust it.
    # Regressing his own published district margins on the Cook PVI he ships
    # beside them:
    #
    #     House    posterior_margin = 5.690 + 1.114 x PVI    R2 = 0.978
    #     Senate   posterior_margin = 6.141 + 1.199 x PVI    R2 = 0.949
    #
    # An R2 of 0.978 across 435 districts means that line IS his district
    # model; polling enters only 8 of them. Cook PVI is a SHARE deviation, so
    # the unit-consistent multiplier is 2.0 — a district three points more
    # Democratic in share is six points more Democratic in margin. Our own
    # seats.py uses exactly 2.0, and his state PVIs agree with ours in scale
    # (AL -15 vs -14.81, CO +5 vs +5.97, DE +7 vs +8.01), so this is one
    # multiplier on the same index and not two different indices.
    #
    # A coefficient of 1.11 compresses every district 45% toward the national
    # environment, which in a D+5.7 year converts a large block of R-leaning
    # seats into D-favoured ones. Re-running HIS districts with HIS uncertainty
    # and only the coefficient changed: 2.0 gives 226.9 expected D seats, 1.7
    # gives 233.3, his 1.114 gives 256.5 against his published 250.79. The
    # whole 23-seat gap between him and every other estimate on the site is
    # that one number.
    #
    # WHAT IS NOT WRONG. His national margin (D+5.73) comes from a separate
    # hierarchical model and is untouched by this. His file is also internally
    # consistent to the decimal — the seat distribution, the district
    # probabilities and the summary all agree — which is the only reason the
    # error was diagnosable from outside at all.
    #
    # WHY STILL COLLECTED. His outputs/ is gitignored and Pages overwrites each
    # run, so this archive is the only record his forecast ever existed. That
    # is worth more, not less, when a model turns out to have a fault in it:
    # the series is the evidence. `private` keeps every row for class use and
    # for the post-election release, and out of the daily published tier.
    #
    # HIS OWN FILE SAYS SO TOO, in a smaller way: metadata.model_status has
    # read "degraded" since 2026-08-19, with warnings that two FRED inputs are
    # degraded. Nothing here parses that field. It is in raw/ for anyone who
    # wants it.
    declared_inputs: [silver_bulletin]   # takes polling input from Silver Bulletin
    license: permitted
    robots_checked: 2026-08-19
    config:
      urls:
        - name: house_forecast
          url: https://grantbw4.github.io/2026-midterms-forecast/forecast.json
        - name: senate_forecast
          url: https://grantbw4.github.io/2026-midterms-forecast/senate_forecast.json
        # timeline.json 404s as of 2026-08-19 — he publishes only the two
        # forecast files. Left out rather than generating a daily failure note.
    notes: >
      MIT licence, repo grantbw4/2026-midterms-forecast (default branch `master`).
      IMPORTANT: outputs/ is GITIGNORED in the repo — the JSON is built by his
      Action and published to GitHub Pages, which OVERWRITES each run. So his git
      history is NOT an archive of the forecast, contrary to an earlier note here.
      Nothing preserves his daily series except our capture. That makes daily
      collection of this source more valuable, not less.
      Verified 2026-08-19: forecast.json served at the Pages root, 200 OK.
      NOT independent: polling input comes from Silver Bulletin.
      DO NOT extract the per-district `pvi` field — it is sourced from Cook PVI
      (see pvi_source), which is permission_pending. Ingesting it would launder
      a gated source through a permitted one.

  - id: ddhq
    name: Decision Desk HQ
    category: professional
    method: http
    enabled: false                 # <-- blocked pending robots check
    cadence: daily
    publication: aggregate_only
    declared_inputs: [polymarket, kalshi]   # ingests BOTH markets by volume weight
    license: permission_pending
    robots_checked: null
    config:
      urls:
        - name: forecast_2026
          url: https://votes.decisiondeskhq.com/forecast/2026
        - name: forecast_senate
          url: https://votes.decisiondeskhq.com/forecast/2026/senate
    notes: >
      decisiondeskhq.com robots.txt is `Allow: /`, but the forecast lives on the
      votes. SUBDOMAIN whose robots could not be retrieved during the audit.
      ACTION: fetch https://votes.decisiondeskhq.com/robots.txt by hand, and if
      clear, set enabled:true and license:permitted.
      Ingests Polymarket and Kalshi, so it is NOT independent of the market
      category — do not treat as a separate draw.

  # ---------------------------------------------------------------- polling --

  - id: silver_bulletin
    name: Silver Bulletin generic ballot
    category: polling
    method: http
    enabled: true
    cadence: daily
    publication: aggregate_only    # see licence note — collect yes, republish no
    declared_inputs: []
    license: permitted
    robots_checked: 2026-08-19
    config:
      urls:
        - name: generic_ballot_polls
          url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRsvXNCZ0ubJr8D_yNcU5q6C0_HBa35K7oDK03KpO7Ca43UwdXaIdvVLWoXEmHHph0EREz5430Hm5yZ/pub?output=csv"
    notes: >
      THIS IS THE POLLING CATEGORY. Roughly 350 individual generic-ballot polls
      from Aug 2025 onward, 25 columns, updated near-daily. Columns include both
      raw (dem/rep/net) and house-effect + likely-voter adjusted (adjusted_*)
      figures, each poll's weight and influence in his average, and a URL back to
      the original pollster release.
      ROBOTS: natesilver.net blocks GPTBot and Google-Extended but does NOT name
      ClaudeBot, CCBot or anthropic-ai. The CSV is a published-to-web Google
      Sheet, which Google's robots explicitly permits (Allow: /spreadsheets/d/*/pub).
      LICENCE: none stated. He publishes the sheet deliberately for reuse, but
      there is no CC grant, so this is `aggregate_only` — we may compute and show
      a polling average, we may NOT republish his individual poll rows. Worth
      writing to ask; a yes would upgrade this to `individual`.
      ARCHIVE VALUE: the adjusted_* columns are model output that gets revised
      retroactively. Capturing daily preserves the vintage structure, which
      neither Silver nor anyone else keeps. That is a genuinely novel thing this
      archive would hold.
      His pre-2025 historical archive is paywalled; only the current cycle is free.
      SCOPE: this entry covers the FREE generic-ballot poll list only. His 2026
      FLIPR seat forecast is paid-subscriber-only and is NOT collected — if you
      ever get access, it belongs in `professional`, as a separate source id, not
      folded in here. Keeping the two apart matters: grant_williams declares
      silver_bulletin as a polling input, so merging them would make the
      dependency graph lie.

  # --------------------------------------------- baselines (static reference) --

  - id: fred
    name: FRED / BEA — real disposable personal income per capita
    category: fundamentals
    method: http
    enabled: true
    cadence: monthly
    publication: individual
    declared_inputs: []
    license: permitted
    robots_checked: 2026-08-20
    # A monthly series is byte-identical for about thirty days by definition.
    # The ten-day default would emit a STALE note every single month for a
    # source behaving perfectly, and a warning that always fires is one nobody
    # reads. Forty-five days still catches a genuinely abandoned series.
    stale_after_days: 45
    config:
      urls:
        - name: income_annual
          url: https://fred.stlouisfed.org/graph/fredgraph.csv?id=A229RX0A048NBEA
        - name: income_monthly
          url: https://fred.stlouisfed.org/graph/fredgraph.csv?id=A229RX0
    notes: |
      THE THIRD INPUT TO THE FUNDAMENTALS MODEL, which until 2026-08-20 was the
      literal number 1.5 with a comment reading PLACEHOLDER. That number was
      reaching the public page inside "D+9.5", presented with an 80% interval
      and the words "fit on 20 midterms, 1946-2022". The fit was real; one of
      the inputs was not.

      DEFINITION, VERIFIED NOT ASSUMED. The model was fitted on the election
      year's year-over-year percentage change in A229RX0A048NBEA (annual,
      chained 2017 dollars):
          2021 annual  51,888
          2022 annual  48,716
          change       (48716 - 51888) / 51888 * 100 = -6.113
      and HISTORY in fundamentals.py records 2022 as -6.11. Exact match.

      THE STRUCTURAL AWKWARDNESS: the 2026 annual observation does not exist
      until 2027, and that is true of every cycle this model will ever run in.
      The fitted quantity is unavailable on election day by construction, so
      something must stand in for it. The parser emits three candidates rather
      than silently picking one — last full year, year-to-date average vs prior
      full year, and latest month year-over-year — and the model uses the
      year-to-date figure because it has the same shape as the fitted quantity
      (an average against an average). Burying that choice inside a single
      number called "income" is how the last placeholder became invisible.

      UNITS CAVEAT: the monthly series is seasonally adjusted (SAAR), the
      annual one is not. Averaging SA months approximates the NSA annual figure
      closely but not exactly, so the year-to-date estimate carries slop the
      last-full-year figure does not.

      LICENCE: U.S. Bureau of Economic Analysis, tagged on FRED as "Public
      Domain: Citation Requested". Redistributable with attribution; cite BEA
      via FRED. ROBOTS (checked 2026-08-20): fred.stlouisfed.org gives the
      wildcard Crawl-delay 1 and disallows only /graph/graph-landing.php,
      /graph/image.php, /graph/fredgraph.png, /searchresults and /seriesBeta.
      The .csv endpoint used here is NOT disallowed. GPTBot, ChatGPT-User and
      Google-Extended get a 30-day crawl-delay; ClaudeBot is not named and
      falls through to the wildcard.

      NOT A FORECAST: these are right-hand-side variables, so aggregate.py
      excludes them from every average via NOT_A_FORECAST. There is one true
      value and BEA publishes it; averaging it across forecasters would be
      meaningless.

  - id: medsl
    name: MIT Election Data and Science Lab — official returns
    category: fundamentals
    method: http
    enabled: true
    cadence: sporadic              # certified results do not change
    publication: individual        # CC0 — public domain dedication
    declared_inputs: []
    license: permitted
    robots_checked: 2026-08-19
    # Certified election returns are STATIC. Artifacts captured or imported on
    # one date stay valid forever, so the parser looks back to the most recent
    # date that has each artifact rather than requiring all of them today.
    # Without this, a hand-imported file vanishes from the parser's view the
    # moment tomorrow's capture creates a new date directory.
    static_artifacts: true
    config:
      urls:
        - name: president_state_2024
          url: https://raw.githubusercontent.com/MEDSL/2024-elections-official/main/2024-president-state.csv
        - name: senate_state_2024
          url: https://raw.githubusercontent.com/MEDSL/2024-elections-official/main/2024-senate-state.csv
        # NOTE: president_state_1976_2024 is NOT fetched. The Dataverse API
        # returns 400 to that download path and the site is not scriptable from
        # here. The file was downloaded by hand and imported with:
        #   manual_import.py --source medsl --raw-file --artifact-name president_state_1976_2024
        # It carries 1976-2024 including the 2020 cycle the state PVI needs.
        # Static reference data: certified returns do not change, so one import
        # is permanent. See `static_artifacts` below.
    notes: >
      STATEWIDE PARTISAN BASELINES for the ~35 Senate and ~36 Governor races,
      the statewide equivalent of the district PVI we hold from Cook.
      Licence CC0 1.0 (public domain dedication) via Harvard Dataverse
      doi:10.7910/DVN/42MVDX, "U.S. President 1976-2024", version 10.0. No
      attribution obligation, no share-alike, fully redistributable — the only
      genuinely unencumbered source in this registry.
      WHY NOT COOK'S STATE PVI: it exists, but cookpolitical.com robots gives
      ClaudeBot `Disallow: /`, the page is subscriber-only, and the terms forbid
      use "as a stand-alone product apart from your own work" — which a
      redistributable archive of PVI values plainly is. We compute our own from
      MEDSL instead, using Cook's published method (2020 and 2024 presidential
      two-party vote vs the national average, weighting the recent election more
      heavily). Same construct, zero encumbrance, fully documentable.
      2020 presidential by state is needed for the two-cycle blend and should
      arrive in the 1976-2024 Dataverse bundle above. Confirm on the first run.
      MODELLING CAUTION: Senate and especially Governor races are much less
      nationalised than House races, so a presidential-derived baseline needs a
      WIDER error band for Governor than Senate, and wider for Senate than House.
      Do not apply one uniform swing to all three. (Sievert & McKee 2019; Hopkins.)

  # ----------------------------------------------- manual entry (not scraped) --

  - id: cook_state_pvi
    name: Cook PVI — statewide
    category: fundamentals
    method: manual
    enabled: true
    cadence: sporadic
    publication: private           # *** NEVER published, same as district PVI ***
    declared_inputs: []
    license: permitted             # permitted to COLLECT by hand, NOT to republish
    robots_checked: 2026-08-19
    # Hand-imported once, then must stay visible on every later date. Without
    # this the file lives only under the date it was imported, and the parser —
    # which reads one date at a time — stops seeing it the very next day. That
    # is precisely what happened: the 2026-08-19 import vanished from the
    # 2026-08-20 parse, taking the district PVI, and therefore the private
    # House model's only input, with it. Same fix as medsl.
    static_artifacts: true
    config:
      source_url: https://www.cookpolitical.com/cook-pvi/2025-partisan-voting-index/state-map-and-list
    notes: >
      Statewide PVI for all 50 states and DC — the baseline the Senate and
      Governor models need, the statewide analogue of the district file.
      NOT SCRAPED. cookpolitical.com gives ClaudeBot `Disallow: /`, the page is
      subscriber-only, and the terms forbid use "as a stand-alone product apart
      from your own work". Hand-entered from a page the instructor subscribes to,
      same as the district file. Import with:
        python3 forecast/collect/manual_import.py --source cook_state_pvi --file <paste>
      SOURCED VIA WIKIPEDIA (decided 2026-08-19). Cook's own state page is
      subscriber-only and hard to even find. Wikipedia's "Cook Partisan Voting
      Index" article carries the same table, sourced to Cook's 2025 release.
      IMPORTANT: taking it from Wikipedia does NOT relicense it. Wikipedia's
      CC BY-SA covers Wikipedia's own text; it cannot relicense Cook's
      compilation, and Cook's terms forbid use "as a stand-alone product apart
      from your own work". So this stays `private` exactly as if taken from
      Cook directly. Class use only.
      Record the retrieval route in the import: --accessed-url should point at
      the Wikipedia article, not at cookpolitical.com, because that is what was
      actually read.
      Cook's stated method: based on the 2020 AND 2024 presidential elections
      versus the national average, with the more recent election weighted more
      heavily (2022 methodology update).
      CROSS-CHECK: we can compute our own state PVI from MEDSL (CC0) using that
      same method. Holding both lets us validate ours against theirs and publish
      OURS, which is the point — a redistributable index we can actually show.

  - id: dra
    name: Dave's Redistricting — district election composites (2026 and prior maps)
    category: fundamentals
    method: manual                 # exported by a human; capture.py never fetches it
    enabled: true
    cadence: sporadic              # re-exported when a state's map changes
    publication: private           # *** see PUBLICATION below — this is meant to change ***
    declared_inputs: []
    license: permitted
    robots_checked: 2026-08-25
    # Same reason as cook_pvi and medsl: imported on one date and needed on
    # every later one. Without this the composite vanishes from tomorrow's
    # parse and the House model loses its baseline overnight.
    static_artifacts: true
    config:
      source_url: https://davesredistricting.org/
      inbox: forecast/data/DRA
    notes: >
      WHAT IT IS. For every district on a plan, DRA computes a composite of
      recent statewide election results inside those boundaries. Held for both
      the 2026 lines and, in the ten states that redrew, the lines they
      replaced, so a district's index carries the map that was actually in
      force on the date being projected.
      HOW IT ARRIVES. Exported by hand from the app into the inbox folder
      above, then snapshotted into raw/ verbatim with hashes by:
        python3 forecast/collect/dra_import.py --dir forecast/data/DRA --snapshot
      The inbox is an inbox, not the archive. Re-exporting a state overwrites
      the download; the raw store keeps every dated version.
      UNITS. An absolute two-party Democratic share inside the district, NOT a
      deviation from the nation. It is emitted as `composite_share` rather than
      `pvi` for exactly that reason — the two scales are not interchangeable
      and one column must not hold both. Centring happens once, visibly, in
      model/polling.py.
      WHY WE HOLD IT: it is the district baseline that can be published. Cook
      PVI is the better-centred index and is private forever; the redistricting
      page needs a number a reader can check.
      PUBLICATION: `private` today, and this is the field to change. DRA do not
      forbid republication. Their data is assembled from state partners — VEST,
      the Redistricting Data Hub and others, differing by state — and this
      archive has not yet written that per-state attribution into the methods
      page. Taking the permission without honouring its condition is not
      something to do by omission. When the attribution table lands, set this
      to `individual`, and check that `composite_share` is not caught by
      NEVER_PUBLISH in aggregate.py.
      KNOWN GAP: DRA has no district export for the six single-district states
      (AK, DE, ND, SD, VT, WY), because there the district IS the state. Those
      six are filled from our own MEDSL-derived state composite; see
      model/state_composite.py and dra_baseline() in model/polling.py.

  - id: cook_pvi
    name: Cook Partisan Voting Index (2026 lines)
    category: fundamentals
    method: manual                 # entered by a human; capture.py never fetches it
    enabled: true
    cadence: sporadic              # PVI is recomputed once per redistricting
    publication: private           # *** NEVER published, in any form ***
    declared_inputs: []
    license: permitted             # permitted to COLLECT by hand, NOT to republish
    robots_checked: 2026-08-19
    # Hand-imported once, then must stay visible on every later date. Without
    # this the file lives only under the date it was imported, and the parser —
    # which reads one date at a time — stops seeing it the very next day. That
    # is precisely what happened: the 2026-08-19 import vanished from the
    # 2026-08-20 parse, taking the district PVI, and therefore the private
    # House model's only input, with it. Same fix as medsl.
    static_artifacts: true
    config:
      source_url: https://www.cookpolitical.com/cook-pvi/2026-partisan-voting-index/district-map-and-list
    notes: >
      NOT SCRAPED, AND MUST NOT BE. cookpolitical.com declares the ratings
      proprietary and enforces against crawlers at the Cloudflare edge; the
      `cook` source elsewhere in this registry stays permission_pending for
      exactly that reason.
      This entry is for data typed or pasted in by hand from a page the
      instructor is entitled to view, which is a different act from automated
      collection. Import with:
        python3 forecast/collect/manual_import.py --source cook_pvi --file <paste.txt>
      The verbatim paste is stored alongside the parsed rows, hashed, with the
      date and the person who entered it, so provenance matches an automated
      capture.
      WHY WE HOLD IT: the class fundamentals model needs a district baseline.
      PVI is a better baseline than a single cycle's presidential result because
      it averages two cycles against the national vote.
      PUBLICATION: private, and `pvi` is additionally in NEVER_PUBLISH in
      aggregate.py. If Cook grants written permission, relax the registry field
      FIRST and NEVER_PUBLISH second — never the other way round.

