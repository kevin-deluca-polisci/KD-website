  - id: predictit
    name: PredictIt
    category: market
    method: http
    enabled: true
    cadence: daily
    publication: individual        # public order book, same basis as Kalshi
    license: permitted
    robots_checked: 2026-08-21
    declared_inputs: []
    config:
      urls:
        - name: marketdata-all
          url: https://www.predictit.org/api/marketdata/all/
    notes: |
      Real-money market with a position cap and, unlike the newer exchanges, a
      long record in the academic literature — this is the market economists
      have actually studied. One endpoint returns every open market, so there
      is no pagination to get wrong.

      THE REASON IT MATTERS HERE: it lists individual Senate races. Kalshi and
      Polymarket carry chamber control and governors; as of today PredictIt is
      the only source of a per-race market price in the archive, which is the
      column the market category has been missing on the comparisons page.

      Caveat for the methods page rather than for the code: `lastTradePrice`
      is the last trade, which on a thin market can be hours old and on either
      side of a wide spread. We do not smooth it.

