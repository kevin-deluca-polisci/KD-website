  - id: wikipedia
    name: Wikipedia race ratings
    category: expert_ordinal
    method: wikipedia
    enabled: true
    cadence: daily
    publication: individual        # CC BY-SA 4.0, attribution required
    declared_inputs: [cook, sabato, inside_elections, race_to_the_wh, economist, votehub, split_ticket]
    license: permitted
    robots_checked: 2026-08-19
    config:
      api: https://en.wikipedia.org/w/api.php
      pages:
        - "2026 United States House of Representatives election ratings"
        - "2026 United States Senate elections"
        - "2026 United States gubernatorial elections"
        # Added 2026-08-19. Carries a poll-AGGREGATION table: one row per
        # aggregator (RCP, Silver Bulletin, ...) with dates, R, D, and margin.
        # This is how the polling category gets populated now that RCP blocks
        # direct collection — second-hand, but CC BY-SA and openly available.
        - "2026 United States House of Representatives elections"
      # Backfill walks revision history to the start of the term. This is the
      # ONLY source in the whole registry that recovers the past — everything
      # else only exists going forward from the day capture starts.
      #
      # TWO DIFFERENT THINGS USE THIS BLOCK, and the distinction matters.
      #
      #   capture.py --backfill  fetches the revision LIST: ids, timestamps,
      #                          users, sizes. It records THAT the page changed
      #                          and never what it said, so nothing downstream
      #                          can read it. Useful as provenance, not as data.
      #   wiki_history.py        fetches the WIKITEXT of one revision per day
      #                          and writes it into that day's raw directory,
      #                          shaped exactly like a live capture, so the
      #                          existing parser reads a recovered day with no
      #                          special case. This is the one that produces
      #                          rows.
      #
      # `since` is inauguration day, matching model/academic.py SERIES_START:
      # the site's frame starts there, so there is nothing to recover before it.
      # It was 2026-01-01, which threw away the whole first year of ratings for
      # no reason other than that nobody had revisited the number.
      #
      # Recovered revisions parse as `archival` provenance — Wikipedia's own
      # dated record of what the page held — which is the class scoring counts
      # as real-time. That is what makes this backfill admissible evidence
      # rather than description; see RULES.md §10.
      backfill:
        enabled: true
        since: 2025-01-20
        max_revisions_per_page: 5000
    notes: >
      CC BY-SA 4.0 — reusable with attribution and share-alike. Full MediaWiki
      API, complete revision history. There is NO standalone Senate ratings
      article; Senate ratings live inside the main Senate elections page.
      Tables lag the forecasters by weeks (June dates observed in August), so
      treat the "as of" dates in the table as authoritative, not the revision
      timestamp.
      TWO DIFFERENT TABLE SHAPES now captured: the ratings articles give one
      column per forecaster with ordinal values; the House elections article
      gives one ROW per poll aggregator with numeric R/D/margin. The parser
      currently reads only the first. Bytes for the second are banking from
      today, so the parser can be written whenever — that is the whole point of
      capturing before parsing.

  # ------------------------------------------------- registered but BLOCKED --
  # Kept here deliberately. A source you decided not to collect is a decision
  # that should be visible and dated, not an absence. capture.py skips all of
  # these because license != permitted.


  - id: wiki_endorsements
    name: Wikipedia candidate endorsements
    # fundamentals, NOT a category of its own. `category` names a FORECAST
    # FAMILY -- aggregate.py groups by it to build the per-family averages the
    # site shows -- and endorsements are an input to a model, not a forecast
    # anyone is making. The convention is FRED's: an input takes the category
    # of the model that will consume it, and is kept out of the averages by
    # QUANTITY, via NOT_A_FORECAST in aggregate.py. Inventing
    # `candidate_quality` here broke capture.py --self-test, which whitelists
    # the six real families, and a self-test failure aborts the whole run --
    # so one unrecognised word in one field cost a day of collection across
    # every source. When this source starts emitting parsed rows, add its
    # quantities to NOT_A_FORECAST before the first run, not after.
    category: fundamentals
    method: wikipedia
    enabled: true
    cadence: daily
    publication: individual        # CC BY-SA 4.0, attribution required
    license: permitted
    robots_checked: 2026-08-25
    # WHY THIS IS DAILY AND DEDUPED.
    #
    # An endorsement is an event with a date, and the date is the point. A
    # citation gives the date the story ran, which is close but is missing on
    # ~30% of entries; capturing every day and storing only what CHANGED makes
    # the archive itself the record. The day a page's bytes move is the day
    # something was added to it, and that is a `captured` first-seen date --
    # the strongest provenance class in the taxonomy -- for every row, not just
    # the well-cited ones.
    #
    # 150 articles at ~150KB is ~22MB a day stored naively, nearly all of it
    # identical to yesterday. `dedup: true` writes the metadata every day and
    # the body only on change. A day with no body is a day we looked and found
    # nothing new, which is a fact worth recording and is not the same as a day
    # with no record.
    config:
      api: https://en.wikipedia.org/w/api.php
      dedup: true
      # 150 titles, generated rather than enumerated. See handle_wikipedia.
      pages_plan:
        module: wiki_endorsements
        function: titles
        cycle: 2026
      # Roughly 29 of the planned titles do not exist in any given cycle --
      # only about 35 states hold a Senate race and 36 a governor's race. The
      # handler counts those as absent rather than as failures.
      backfill:
        enabled: false
        # Deliberately off. capture.py --backfill fetches revision LISTS, which
        # record that a page changed and never what it said. For this source
        # the wikitext of past revisions is what would be worth having, and
        # that is wiki_history.py's job, not this one's.
