  - id: fiftyplusone
    name: FiftyPlusOne (G. Elliott Morris)
    category: professional
    method: http
    enabled: false
    cadence: weekly
    publication: private
    declared_inputs: [cook, sabato, inside_elections]
    license: permission_pending
    robots_checked: 2026-08-19
    config: {urls: []}
    notes: >

      PLANNED PRIMARY SOURCE (decision 2026-08-20). Kevin is subscribing for API
      access. Once live this is intended to carry the bulk of the archive's
      race-level data — it is the most comprehensive single feed available and
      the easiest to consume — and it should also supply PRESIDENTIAL APPROVAL,
      which is currently the last hand-set input in the fundamentals model
      (approval=38.0, typed in, not pulled).

      *** PAYING FOR ACCESS IS NOT PERMISSION TO REPUBLISH. *** These are
      separate questions and conflating them is the easiest way to get this
      project into trouble. A subscription grants us the right to READ the
      data; what we may PUBLISH is governed by the subscription terms, which
      have not been read yet. Until they have been:
        - keep license: permission_pending and enabled: false
        - when the subscription is live, read the terms and set `publication`
          to what they actually allow (aggregate_only is the safe default)
        - record the plan tier, the date, and the clause relied on, in these
          notes — future-us will not remember
      robots.txt blocking ClaudeBot, GPTBot, CCBot and Scrapy by name stops
      mattering once we are an authenticated paying client rather than a
      crawler, but the licence question is untouched by that.

      NOT INDEPENDENT: stacks an expert-ratings sub-model, so it is not a clean
      separate draw from the professional category. Set declared_inputs when
      the methodology is known.
      /api/csv exists and is robots-ALLOWED but returns 401 — paid.
      robots blocks ClaudeBot, GPTBot, CCBot, and `Scrapy` BY NAME, which is an
      unusually direct signal against automated collection. Ask first.
      Stacks an expert-ratings sub-model, so not independent.

