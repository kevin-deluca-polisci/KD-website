      article: https://www.theargumentmag.com/p/split-ticket-2026-midterms-model
      # Datawrapper chart ids as of 2026-08-22, read off the article.
      datawrapper:
        house_map: u9EZf
        house_table: Cy0fK          # per-district probabilities and margins
        house_control: 5UEYH
        house_seats: 2OrV2
        house_scenarios: gKHb7
        senate_map: g4hHM
        senate_table: Hus3x         # per-state probabilities and margins
        senate_control: toEMi
        senate_seats: GhLiF
        senate_scenarios: X2WrG
      urls: []                       # built at capture time — see notes
    notes: >
      Split Ticket now publishes inside The Argument, which changes the
      licence question rather than settling it: the model is behind a
      subscription publication, and paying for access has never been permission
      to redistribute. publication stays `private` and license stays
      permission_pending until somebody answers a letter.
      ALREADY REACHING US, at the national level only. Wikipedia's
      poll-aggregation table lists Split Ticket's generic-ballot average and the
      parser attributes it back at this same private tier. What is NOT reaching
      us, and what this entry is for, is the RACE-LEVEL forecast — which is
      precisely what the professional category is short of.
      THE CSV ROUTE, verified 2026-08-22 as far as it can be from here. The
      Datawrapper charts expose their underlying data at
      https://datawrapper.dwcdn.net/<id>/<version>/dataset.csv — note the
      VERSION segment. The unversioned path 404s; /1/dataset.csv returns data.
      That version increments when they republish a chart, so a hardcoded /1/
      WILL break silently the first time they update the forecast, which is the
      worst failure mode this project has: a stale number that still looks
      live. The capture step must read the chart page at
      https://datawrapper.dwcdn.net/<id>/ and take the version from it rather
      than assuming one, and the parser must refuse a payload whose row count
      collapses.
      NOT YET ENABLED. The route exists; the permission does not. Enabling this
      captures race-level forecasts from a paid publication into the private
      archive, which is defensible under the project's own rule — collect
      privately, publish only aggregates — but it is a bigger step than the
      aggregator rows we take off Wikipedia, and it should be taken knowingly
      rather than as a side effect of a registry edit.

