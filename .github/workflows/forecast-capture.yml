# Daily capture — stage 1 only.
# Install at .github/workflows/forecast-capture.yml in KD-website.
#
# Captures raw bytes, pushes them to the PRIVATE archive repo, then runs the
# full pipeline and publishes the public tier back to this repo, which triggers
# the Pages deploy. The site therefore rebuilds daily.
#
# This used to stop after capture, on the reasoning that a human should read
# the numbers before they go live. That reasoning was sound — in one day of
# work this pipeline produced Idaho at D+11.6, House seats of 24-24, and a
# Senate forecast for fifteen states with no 2026 Senate race, none of which
# raised an exception. What replaced the human is forecast/collect/sanity.py:
# assertions about the WORLD (35 Senate races, probabilities in [0,1], House
# seats summing to 435, no category moving five points overnight) that must
# pass before anything is committed. If the gate trips, nothing is published,
# yesterday's page stays up, and an issue is opened.
#
# SETUP (once):
#   1. Create a PRIVATE repo, e.g. kevin-deluca-polisci/plsc2219-raw
#   2. Create a fine-grained PAT with Contents:write on that repo only
#   3. Add it here as the RAW_ARCHIVE_TOKEN secret
#   4. Set RAW_ARCHIVE_REPO below
 
name: Forecast capture (daily)
 
# TWO ATTEMPTS, AND NEITHER ON THE HOUR. Measured, not guessed — every
# Action-authored commit between 2026-08-24 and 2026-08-28, against a "0 11"
# schedule:
#
#     08-24  11:33 UTC   on time
#     08-25  —           never ran at all
#     08-26  14:07 UTC   three hours late
#     08-27  21:02 UTC   ten hours late
#     08-28  —           dropped; run by hand at 16:12
#
# GitHub queues scheduled workflows at best effort, delays them under load and
# drops them outright when contention is high, and the top of the hour is the
# most contended minute on the platform because it is what everybody types.
# Minute 37 is not magic; it is simply not minute 0.
#
# The second attempt is the part that actually buys reliability. The pipeline
# is idempotent — capture is newest-wins, aggregate refuses a history that
# shrinks, publish rewrites derived files that are pure functions of the data —
# so a second run on a day the first succeeded is close to a no-op, and on a
# day the first was dropped it is the difference between a captured day and a
# hole in the record. A missing day cannot be recovered later: nobody archives
# what a poll aggregator said last Tuesday.
on:
  schedule:
    - cron: "37 11 * * *"
    - cron: "37 16 * * *"
  workflow_dispatch:
    inputs:
      only:     {description: "Comma-separated source ids (blank = all)", required: false, default: ""}
      dry_run:  {description: "Fetch nothing, just report", type: boolean, required: false, default: false}
      backfill: {description: "Include Wikipedia revision backfill (run once)", type: boolean, required: false, default: false}
      force_aggregate:
        description: >-
          Force aggregate. Let aggregate.py write even if a snapshot date loses rows. Default off.
          The guard exists because a clone without the raw archive rebuilds only
          the newest day and would silently publish a shorter file over a longer
          one. Turn this on ONLY when you know the shortening is correct — for
          example after a pipeline change makes an older published date
          unreproducible, which is the one case the guard cannot distinguish from
          real loss. Read what it refused before overriding it.
        type: boolean
        required: false
        default: false
      
      backfill_academic:
        description: >-
          Recompute the academic models over the whole poll record and project
          each date. One-off, not for the daily run: it reconstructs the generic
          ballot from Silver's poll-level file back to Jan 2025 and runs one
          Monte Carlo per point, so it adds several minutes. Safe to repeat —
          it rebuilds from the archive rather than appending.
        type: boolean
        required: false
        default: false

      backfill_markets:
        description: >-
          Reconstruct market price history from Kalshi candlesticks and
          Polymarket prices-history, into the private raw archive. One-off.
          Never overwrites a real capture. Run this only after a capture has
          confirmed the seat ladders are fetchable.
        type: boolean
        required: false
        default: false
        
      backfill_wikipedia:
        description: >-
          Recover Wikipedia's revision history into dated captures. One
          revision per day, written as the artifact the live capture would have
          written, so the existing parser reads a recovered day with no special
          case. Never overwrites a real capture.
        type: boolean
        required: false
        default: false

      wiki_since:
        description: "Earliest revision date for backfill_wikipedia (blank = registry default, 2025-01-20)"
        required: false
        default: ""

      wiki_step_days:
        description: "Day grid for backfill_wikipedia: 7 = weekly (fast), 1 = daily (slow)"
        required: false
        default: "7"
        
concurrency: {group: forecast-capture, cancel-in-progress: false}
# issues: write is needed by the gate's issue-opening step. Without it that
# step fails with 'Resource not accessible by integration' — and it only runs
# when something has ALREADY gone wrong, so the failure would surface exactly
# when the alarm was supposed to.
permissions: {contents: write, issues: write}
 
env:
  RAW_ARCHIVE_REPO: kevin-deluca-polisci/plsc2219-raw
  CYCLE: "2026"
 
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
 
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
 
      - run: pip install -r forecast/collect/requirements.txt
 
      - name: Validate registry
        # Fails fast on a malformed registry, and refuses to run at all if a
        # source marked `prohibited` has been enabled.
        run: python3 forecast/collect/capture.py --self-test
 
      - name: Restore the private raw archive
        if: inputs.dry_run != true
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.RAW_ARCHIVE_TOKEN }}@github.com/${RAW_ARCHIVE_REPO}.git" \
            /tmp/rawrepo 2>/dev/null || { mkdir -p /tmp/rawrepo && git -C /tmp/rawrepo init -q; }
          mkdir -p "forecast/data/${CYCLE}"
          if [ -d "/tmp/rawrepo/${CYCLE}/raw" ]; then
            cp -r "/tmp/rawrepo/${CYCLE}/raw" "forecast/data/${CYCLE}/raw"
          fi
          # Private DERIVED state, restored for the same reason as raw/: the
          # runner is destroyed after every job, and this cannot be recomputed.
          # Today it holds seat_projections_history.json — every day's seat
          # projections, written down on the day. polling_model.json and
          # fundamentals_model.json are overwritten on every run, so the inputs
          # that produced Tuesday's projection are gone by Wednesday; the only
          # copy is the one saved at the time. Without this restore the history
          # starts empty on every run, every projection lands on the newest
          # date, and each rebuild strips them from every earlier one.
          if [ -d "/tmp/rawrepo/${CYCLE}/model_private" ]; then
            cp -r "/tmp/rawrepo/${CYCLE}/model_private" "forecast/data/${CYCLE}/model_private"
          fi
          # THE ARCHIVE CARRIES SHARDS, NOT THE MONOLITH, so the copy above no
          # longer brings seat_projections_history.json with it and this line
          # is what puts it back.
          #
          # From 2026-08-27 the archive holds model_private/history/, one file
          # per date. The monolith was 348 MB, which GitHub rejects outright at
          # over 100 MB; gzipping it cleared that but not the growth, because a
          # new date changes the compressed bytes throughout and gzip does not
          # delta-compress, so every nightly push committed a fresh 34 MB blob.
          # Shards cost one ~600 KB file a day instead.
          #
          # WITHOUT THIS LINE the failure is quiet and total: seats.py finds no
          # history, starts from empty, and writes a one-date file. aggregate
          # and publish then run on it and the site's timeline collapses to
          # today. --unshard refuses if a monolith is already present, so it is
          # safe to run unconditionally.
          if [ -d "forecast/data/${CYCLE}/model_private/history" ]; then
            python3 forecast/history_merge.py --cycle "$CYCLE" --unshard
          fi
 
      - name: Capture
        id: capture
        continue-on-error: true   # a failed source must not block committing the rest
        run: |
          ARGS=""
          [ -n "${{ inputs.only }}" ]           && ARGS="$ARGS --only ${{ inputs.only }}"
          [ "${{ inputs.dry_run }}" = "true" ]  && ARGS="$ARGS --dry-run"
          [ "${{ inputs.backfill }}" = "true" ] && ARGS="$ARGS --backfill"
          python3 forecast/collect/capture.py --cycle "$CYCLE" $ARGS
      - name: Backfill market history
        # The test is in the SHELL, not in `if:`. A workflow_dispatch boolean
        # arrives here as the string 'true', so `inputs.x == true` compares a
        # string against a boolean and is always false — the step silently
        # never runs. Every other boolean in this file uses this form.
        if: inputs.dry_run != true
        run: |
          if [ "${{ inputs.backfill_markets }}" = "true" ]; then
            python3 forecast/collect/market_history.py --cycle "$CYCLE"
          else
            echo "backfill_markets not set — skipping market history"
          fi
      - name: Backfill Wikipedia revision history
        # Before the raw push, like the market backfill and for the same
        # reason: this writes into raw/, and a step after the push would have
        # its work thrown away with the runner.
        if: inputs.dry_run != true
        run: |
          if [ "${{ inputs.backfill_wikipedia }}" = "true" ]; then
            WIKI_ARGS="--step-days ${{ inputs.wiki_step_days || '7' }}"
            if [ -n "${{ inputs.wiki_since }}" ]; then
              WIKI_ARGS="$WIKI_ARGS --since ${{ inputs.wiki_since }}"
            fi
            python3 forecast/collect/wiki_history.py --cycle "$CYCLE" $WIKI_ARGS
          else
            echo "backfill_wikipedia not set — skipping wikipedia history"
          fi
      - name: Push raw to the private archive
        if: inputs.dry_run != true
        run: |
          mkdir -p "/tmp/rawrepo/${CYCLE}"
          rsync -a --delete "forecast/data/${CYCLE}/raw/" "/tmp/rawrepo/${CYCLE}/raw/"
          cd /tmp/rawrepo
          git config user.name  "forecast-archive[bot]"
          git config user.email "forecast-archive@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && { echo "no new raw"; exit 0; }
          git commit -m "raw: snapshot $(date -u +%Y-%m-%d)"
          git remote add origin \
            "https://x-access-token:${{ secrets.RAW_ARCHIVE_TOKEN }}@github.com/${RAW_ARCHIVE_REPO}.git" 2>/dev/null || true
          git push origin HEAD:main
      # ---- publish -------------------------------------------------------
      # Added when the site moved to a daily rebuild. Ordering matters: the
      # models read parsed/, aggregate enforces the publication tiers and
      # exits non-zero if they are violated, publish assembles the payload,
      # and sanity refuses to let obviously-wrong numbers reach the page.
      #
      # Every step here is `set -e` by default, so a failure anywhere stops
      # before the commit. Nothing is published on a bad day; yesterday's page
      # stays up, which is the better of the two failure modes.
      - name: Parse, model, aggregate, publish
        if: inputs.dry_run != true
        run: |
          python3 forecast/collect/parse.py     --cycle "$CYCLE" --all
          python3 forecast/model/state_pvi.py   --cycle "$CYCLE"
          # fundamentals MUST run daily. It was left out of this list when the
          # daily pipeline was written, on the reasoning that it is a static
          # model whose inputs arrive as CLI arguments. That stopped being true
          # the moment it started reading real income growth out of the FRED
          # capture: the model now moves with the data, and skipping it froze
          # the published figure at D+9.5 while the model itself had moved to
          # D+10.5. A frozen number on a live page is worse than no number.
          # approval.py BEFORE fundamentals, and it was missing from this list
          # entirely — added to run.sh and not here, which is the same mistake
          # the comment above describes, made again. It builds
          # derived/approval.json, the three-construction approval panel, and
          # fundamentals.py reads the aggregator consensus out of it to print
          # beside its own input. Left out, the panel freezes at whatever date
          # it was last built by hand and the model file quotes a stale
          # aggregate — a frozen number on a live page, again.
          python3 forecast/model/approval.py    --cycle "$CYCLE"
          python3 forecast/model/fundamentals.py --cycle "$CYCLE"
          POLL_ARGS=""
          [ "${{ inputs.backfill_academic }}" = "true" ] && POLL_ARGS="--backfill"
          python3 forecast/model/polling.py     --cycle "$CYCLE" $POLL_ARGS          
          # academic.py reads the RAW generic ballot out of polling_model.json,
          # so it has to come after polling.py. Run earlier it finds nothing,
          # declines to run, and the academic column vanishes with no error.
          ACAD_ARGS=""
          [ "${{ inputs.backfill_academic }}" = "true" ] && ACAD_ARGS="--backfill"
          python3 forecast/model/academic.py    --cycle "$CYCLE" $ACAD_ARGS          
          # seats.py runs LAST of the models and reads the two JSONs the
          # steps above write. It pushes each tide through the same seat
          # machinery, which is what gives fundamentals and polling a seat
          # count and a chamber probability instead of a national margin
          # and four empty cells.
          SEAT_ARGS=""
          [ "${{ inputs.backfill_academic }}" = "true" ] && SEAT_ARGS="--backfill-academic"
          python3 forecast/model/seats.py       --cycle "$CYCLE" $SEAT_ARGS          
          AGG_ARGS=""
          [ "${{ inputs.force_aggregate }}" = "true" ] && AGG_ARGS="--force"
          python3 forecast/collect/aggregate.py --cycle "$CYCLE" $AGG_ARGS
          python3 forecast/collect/publish.py   --cycle "$CYCLE"
 
      # Runs AFTER the models, because it carries a file they write, and
      # BEFORE the public commit, so a failure here is loud rather than
      # arriving after the site has already been updated. The raw push earlier
      # in this job cannot do it: at that point the models have not run.
      - name: Push private model state to the archive
        if: inputs.dry_run != true
        run: |
          [ -d "forecast/data/${CYCLE}/model_private" ] || exit 0
          mkdir -p "/tmp/rawrepo/${CYCLE}/model_private"
          # NOT --delete, unlike the raw push. raw/ is an authoritative mirror
          # of what was captured; this directory ACCUMULATES, and a run that
          # fails before the models write must not be able to empty it.
          # SHARD BEFORE PUSHING, and this is the other half of the --unshard
          # above. seats.py writes the monolith; the archive stores per-date
          # shards; nothing else refreshes them. Without this line the shard
          # directory freezes at whatever the last human run left there and
          # today's model state exists only on a runner that is about to be
          # destroyed — the archive silently stops recording the history while
          # every green check keeps saying it worked.
          #
          # Bare, with no --from and no --git: those union in older copies,
          # which is a recovery tool and would resurrect rows deliberately
          # removed. No --prune either; deleting a date's last copy is not a
          # thing an unattended job should do.
          python3 forecast/history_merge.py --cycle "$CYCLE" --write
          # The monolith itself is gitignored in the archive. rsync copies it
          # anyway and git ignores it, which is harmless but pointless, so it
          # is excluded here too — along with any .bak or one-off .gz sitting
          # beside it under the same name.
          rsync -a --exclude="seat_projections_history.json*" \
                   "forecast/data/${CYCLE}/model_private/" \
                   "/tmp/rawrepo/${CYCLE}/model_private/"
          cd /tmp/rawrepo
          git config user.name  "forecast-archive[bot]"
          git config user.email "forecast-archive@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && { echo "no change to private model state"; exit 0; }
          git commit -m "model: private state $(date -u +%Y-%m-%d)"
          git remote add origin \
            "https://x-access-token:${{ secrets.RAW_ARCHIVE_TOKEN }}@github.com/${RAW_ARCHIVE_REPO}.git" 2>/dev/null || true
          git push origin HEAD:main
 
      - name: Sanity gate
        if: inputs.dry_run != true
        id: sanity
        run: python3 forecast/collect/sanity.py --cycle "$CYCLE"
 
      - name: Commit the public tier only
        if: inputs.dry_run != true
        run: |
          git config user.name  "forecast-archive[bot]"
          git config user.email "forecast-archive@users.noreply.github.com"
          # An explicit allowlist, never `git add -A`. gitignore is the first
          # line of defence, not the only one — model_private/ was once tracked
          # and pushed because the live .gitignore had drifted.
          git add "forecast/data/${CYCLE}/raw_manifest.csv" \
                  "forecast/data/${CYCLE}/manifest.csv" \
                  "forecast/data/${CYCLE}/derived" \
                  "forecast/data/${CYCLE}/site.json" \
                  "assets/forecast_${CYCLE}.json" 2>/dev/null || true
          git diff --staged --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "forecast: daily update $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" && break; sleep 5
          done
          git push
 
      # A failed gate must be visible, not buried in a red X on a cron job
      # nobody watches.
      - name: Open an issue if the gate blocked publication
        if: failure() && steps.sanity.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Forecast sanity gate blocked publication (${new Date().toISOString().slice(0,10)})`;
            const body = [
              'The daily forecast run captured and parsed normally, but the sanity',
              'gate refused to publish. **The site still shows yesterday\'s numbers.**',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Reproduce locally:',
              '```',
              './forecast/run.sh --from parse',
              'python3 forecast/collect/sanity.py',
              '```',
            ].join('\n');
            const {data: existing} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'forecast-gate'});
            if (existing.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['forecast-gate']});
            }
 
      - name: Report partial failure
        if: steps.capture.outcome == 'failure'
        run: |
          echo "::warning::One or more sources failed — see forecast/data/${CYCLE}/manifest.csv"
          echo "### Forecast capture: partial failure" >> $GITHUB_STEP_SUMMARY
          echo "Successful sources were still captured and committed." >> $GITHUB_STEP_SUMMARY
