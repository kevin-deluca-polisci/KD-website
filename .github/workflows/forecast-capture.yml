# Daily capture — stage 1 only.
# Install at .github/workflows/forecast-capture.yml in KD-website.
#
# Captures raw bytes, pushes them to the PRIVATE archive repo, then runs the
# full pipeline and publishes the public tier back to this repo, which triggers
# the Pages deploy. The site therefore rebuilds daily.
#
# This used to stop after capture, on the reasoning that a human should read
# the numbers before they go live. That reasoning was sound — in one day of
# work this pipeline produced Idaho at D+11.6, House seats of 24-24, and a
# Senate forecast for fifteen states with no 2026 Senate race, none of which
# raised an exception. What replaced the human is forecast/collect/sanity.py:
# assertions about the WORLD (35 Senate races, probabilities in [0,1], House
# seats summing to 435, no category moving five points overnight) that must
# pass before anything is committed. If the gate trips, nothing is published,
# yesterday's page stays up, and an issue is opened.
#
# SETUP (once):
#   1. Create a PRIVATE repo, e.g. kevin-deluca-polisci/plsc2219-raw
#   2. Create a fine-grained PAT with Contents:write on that repo only
#   3. Add it here as the RAW_ARCHIVE_TOKEN secret
#   4. Set RAW_ARCHIVE_REPO below

name: Forecast capture (daily)

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      only:     {description: "Comma-separated source ids (blank = all)", required: false, default: ""}
      dry_run:  {description: "Fetch nothing, just report", type: boolean, required: false, default: false}
      backfill: {description: "Include Wikipedia revision backfill (run once)", type: boolean, required: false, default: false}

concurrency: {group: forecast-capture, cancel-in-progress: false}
# issues: write is needed by the gate's issue-opening step. Without it that
# step fails with 'Resource not accessible by integration' — and it only runs
# when something has ALREADY gone wrong, so the failure would surface exactly
# when the alarm was supposed to.
permissions: {contents: write, issues: write}

env:
  RAW_ARCHIVE_REPO: kevin-deluca-polisci/plsc2219-raw
  CYCLE: "2026"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}

      - run: pip install -r forecast/collect/requirements.txt

      - name: Validate registry
        # Fails fast on a malformed registry, and refuses to run at all if a
        # source marked `prohibited` has been enabled.
        run: python3 forecast/collect/capture.py --self-test

      - name: Restore the private raw archive
        if: inputs.dry_run != true
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.RAW_ARCHIVE_TOKEN }}@github.com/${RAW_ARCHIVE_REPO}.git" \
            /tmp/rawrepo 2>/dev/null || { mkdir -p /tmp/rawrepo && git -C /tmp/rawrepo init -q; }
          mkdir -p "forecast/data/${CYCLE}"
          if [ -d "/tmp/rawrepo/${CYCLE}/raw" ]; then
            cp -r "/tmp/rawrepo/${CYCLE}/raw" "forecast/data/${CYCLE}/raw"
          fi

      - name: Capture
        id: capture
        continue-on-error: true   # a failed source must not block committing the rest
        run: |
          ARGS=""
          [ -n "${{ inputs.only }}" ]           && ARGS="$ARGS --only ${{ inputs.only }}"
          [ "${{ inputs.dry_run }}" = "true" ]  && ARGS="$ARGS --dry-run"
          [ "${{ inputs.backfill }}" = "true" ] && ARGS="$ARGS --backfill"
          python3 forecast/collect/capture.py --cycle "$CYCLE" $ARGS

      - name: Push raw to the private archive
        if: inputs.dry_run != true
        run: |
          mkdir -p "/tmp/rawrepo/${CYCLE}"
          rsync -a --delete "forecast/data/${CYCLE}/raw/" "/tmp/rawrepo/${CYCLE}/raw/"
          cd /tmp/rawrepo
          git config user.name  "forecast-archive[bot]"
          git config user.email "forecast-archive@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && { echo "no new raw"; exit 0; }
          git commit -m "raw: snapshot $(date -u +%Y-%m-%d)"
          git remote add origin \
            "https://x-access-token:${{ secrets.RAW_ARCHIVE_TOKEN }}@github.com/${RAW_ARCHIVE_REPO}.git" 2>/dev/null || true
          git push origin HEAD:main
      # ---- publish -------------------------------------------------------
      # Added when the site moved to a daily rebuild. Ordering matters: the
      # models read parsed/, aggregate enforces the publication tiers and
      # exits non-zero if they are violated, publish assembles the payload,
      # and sanity refuses to let obviously-wrong numbers reach the page.
      #
      # Every step here is `set -e` by default, so a failure anywhere stops
      # before the commit. Nothing is published on a bad day; yesterday's page
      # stays up, which is the better of the two failure modes.
      - name: Parse, model, aggregate, publish
        if: inputs.dry_run != true
        run: |
          python3 forecast/collect/parse.py     --cycle "$CYCLE" --all
          python3 forecast/model/state_pvi.py   --cycle "$CYCLE"
          # fundamentals MUST run daily. It was left out of this list when the
          # daily pipeline was written, on the reasoning that it is a static
          # model whose inputs arrive as CLI arguments. That stopped being true
          # the moment it started reading real income growth out of the FRED
          # capture: the model now moves with the data, and skipping it froze
          # the published figure at D+9.5 while the model itself had moved to
          # D+10.5. A frozen number on a live page is worse than no number.
          python3 forecast/model/fundamentals.py --cycle "$CYCLE"
          python3 forecast/model/polling.py     --cycle "$CYCLE"
          # seats.py runs LAST of the models and reads the two JSONs the
          # steps above write. It pushes each tide through the same seat
          # machinery, which is what gives fundamentals and polling a seat
          # count and a chamber probability instead of a national margin
          # and four empty cells.
          python3 forecast/model/seats.py       --cycle "$CYCLE"
          python3 forecast/collect/aggregate.py --cycle "$CYCLE"
          python3 forecast/collect/publish.py   --cycle "$CYCLE"

      - name: Sanity gate
        if: inputs.dry_run != true
        id: sanity
        run: python3 forecast/collect/sanity.py --cycle "$CYCLE"

      - name: Commit the public tier only
        if: inputs.dry_run != true
        run: |
          git config user.name  "forecast-archive[bot]"
          git config user.email "forecast-archive@users.noreply.github.com"
          # An explicit allowlist, never `git add -A`. gitignore is the first
          # line of defence, not the only one — model_private/ was once tracked
          # and pushed because the live .gitignore had drifted.
          git add "forecast/data/${CYCLE}/raw_manifest.csv" \
                  "forecast/data/${CYCLE}/manifest.csv" \
                  "forecast/data/${CYCLE}/derived" \
                  "forecast/data/${CYCLE}/site.json" \
                  "assets/forecast_${CYCLE}.json" 2>/dev/null || true
          git diff --staged --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "forecast: daily update $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" && break; sleep 5
          done
          git push

      # A failed gate must be visible, not buried in a red X on a cron job
      # nobody watches.
      - name: Open an issue if the gate blocked publication
        if: failure() && steps.sanity.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Forecast sanity gate blocked publication (${new Date().toISOString().slice(0,10)})`;
            const body = [
              'The daily forecast run captured and parsed normally, but the sanity',
              'gate refused to publish. **The site still shows yesterday\'s numbers.**',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Reproduce locally:',
              '```',
              './forecast/run.sh --from parse',
              'python3 forecast/collect/sanity.py',
              '```',
            ].join('\n');
            const {data: existing} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'forecast-gate'});
            if (existing.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['forecast-gate']});
            }

      - name: Report partial failure
        if: steps.capture.outcome == 'failure'
        run: |
          echo "::warning::One or more sources failed — see forecast/data/${CYCLE}/manifest.csv"
          echo "### Forecast capture: partial failure" >> $GITHUB_STEP_SUMMARY
          echo "Successful sources were still captured and committed." >> $GITHUB_STEP_SUMMARY
          exit 1
